
name: DisasterGuard AI - Continuous Integration

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Run Evacuation Engine Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Evacuation Tests
        run: |
          python -m pytest backend/tests/test_evacuation.py -v
