<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disaster Management Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="dashboard">

        <h1>AI Disaster Management System</h1>

        <p>Welcome to the Disaster Management Dashboard</p>

        <div class="dashboard-cards">

            <div class="card">
                <h2>🌪 Disaster Status</h2>
                <p>Monitor current disaster conditions.</p>
            </div>

            <div class="card">
                <h2>⚠ Hazard Zones</h2>
                <p>Identify areas affected by hazards.</p>
            </div>

            <div class="card">
                <h2>🚧 Blocked Routes</h2>
                <p>View roads that are unavailable.</p>
            </div>

            <div class="card">
                <h2>🗺 Evacuation Routes</h2>
                <p>Find safer evacuation routes.</p>
            </div>

        </div>

    </div>

</body>
</html>
